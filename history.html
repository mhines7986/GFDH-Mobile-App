<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History | Game for Disgusting Humans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="history-page">
    <main class="history-container">
        <a class="back-link" href="index.html">Back to game</a>
        <h1 class="history-title">Activity History</h1>
        <p class="history-count" id="historyCount"></p>
        <section class="history-list" id="historyList" aria-live="polite"></section>
        <div class="history-empty" id="historyEmpty">No actions have been picked yet.</div>
        <button class="secondary clear-history-btn" id="clearHistoryBtn" type="button">Clear History</button>
    </main>

    <script>
        const historyList = document.getElementById("historyList");
        const historyEmpty = document.getElementById("historyEmpty");
        const historyCount = document.getElementById("historyCount");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem("activityHistory") || "[]");
            historyList.innerHTML = "";
            historyEmpty.hidden = history.length > 0;
            clearHistoryBtn.hidden = history.length === 0;
            historyCount.textContent = history.length ? `${history.length} action${history.length === 1 ? "" : "s"} picked` : "";

            history.forEach((activity, index) => {
                const parts = activity.text.split(" - ");
                const item = document.createElement("article");
                item.className = "history-item";
                item.innerHTML = `
                    <div class="history-item-top">
                        <span class="history-number">${history.length - index}</span>
                        <span class="category-badge">${activity.category}</span>
                        <time>${new Date(activity.pickedAt).toLocaleString()}</time>
                    </div>
                    <h2>${parts[0]}</h2>
                    ${parts.slice(1).join(" - ") ? `<p>${parts.slice(1).join(" - ")}</p>` : ""}
                `;
                historyList.appendChild(item);
            });
        }

        clearHistoryBtn.addEventListener("click", () => {
            localStorage.removeItem("activityHistory");
            renderHistory();
        });

        renderHistory();
    </script>
</body>
</html>
