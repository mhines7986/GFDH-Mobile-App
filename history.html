<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History | Game for Disgusting Humans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="history-page">
    <main class="history-container">
        <a class="back-link" href="index.html">Back to game</a>
        <h1 class="history-title">Activity History</h1>
        <p class="history-count" id="historyCount"></p>
        <div class="history-filters" aria-label="History filters">
            <button class="filter-button active" data-filter="all" type="button">All</button>
            <button class="filter-button" data-filter="favorites" type="button">Favorites</button>
            <button class="filter-button" data-filter="liked" type="button">Liked</button>
            <button class="filter-button" data-filter="disliked" type="button">Disliked</button>
            <button class="filter-button" data-filter="saved" type="button">Saved for Later</button>
        </div>
        <section class="history-list" id="historyList" aria-live="polite"></section>
        <div class="history-empty" id="historyEmpty">No actions have been picked yet.</div>
        <button class="secondary clear-history-btn" id="clearHistoryBtn" type="button">Clear History</button>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
        <a class="bottom-nav-link" href="index.html">Game</a>
        <a class="bottom-nav-link active" href="history.html">History</a>
        <a class="bottom-nav-link" href="settings.html"><span aria-hidden="true">&#9881;</span>Settings</a>
    </nav>

    <script>
        const historyList = document.getElementById("historyList");
        const historyEmpty = document.getElementById("historyEmpty");
        const historyCount = document.getElementById("historyCount");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");
        const filterButtons = document.querySelectorAll(".filter-button");
        let activeFilter = "all";

        function renderHistory() {
            const storedHistory = JSON.parse(localStorage.getItem("activityHistory") || "[]");
            const history = storedHistory.map((activity, index) => ({
                ...activity,
                id: activity.id || `${activity.pickedAt || Date.now()}-${index}`,
                favorite: activity.favorite === true,
                savedForLater: activity.savedForLater === true
            }));
            const visibleHistory = history.filter((activity) => {
                if (activeFilter === "favorites") return activity.favorite;
                if (activeFilter === "liked") return activity.rating === "up";
                if (activeFilter === "disliked") return activity.rating === "down";
                if (activeFilter === "saved") return activity.savedForLater;
                return true;
            });
            historyList.innerHTML = "";
            historyEmpty.hidden = visibleHistory.length > 0;
            clearHistoryBtn.hidden = history.length === 0;
            historyCount.textContent = visibleHistory.length ? `${visibleHistory.length} action${visibleHistory.length === 1 ? "" : "s"} shown` : "";

            visibleHistory.forEach((activity, index) => {
                const parts = activity.text.split(" - ");
                const item = document.createElement("article");
                item.className = "history-item";
                item.innerHTML = `
                    <div class="history-item-top">
                        <span class="history-number">${history.length - index}</span>
                        <span class="category-badge">${activity.category}</span>
                        <time>${new Date(activity.pickedAt).toLocaleString()}</time>
                        <button class="favorite-button ${activity.favorite ? "selected" : ""}" data-action="favorite" data-history-id="${activity.id}" aria-label="${activity.favorite ? "Remove from favorites" : "Add to favorites"}" title="${activity.favorite ? "Remove from favorites" : "Add to favorites"}">&#9733;</button>
                    </div>
                    <h2>${parts[0]}</h2>
                    ${parts.slice(1).join(" - ") ? `<p>${parts.slice(1).join(" - ")}</p>` : ""}
                    <div class="history-reactions" aria-label="Rate this activity">
                        <button class="reaction-button ${activity.rating === "up" ? "selected" : ""}" data-action="rating" data-rating="up" data-history-id="${activity.id}" aria-label="Like this activity" title="Like this activity">&#128077;</button>
                        <button class="reaction-button ${activity.rating === "down" ? "selected" : ""}" data-action="rating" data-rating="down" data-history-id="${activity.id}" aria-label="Dislike this activity" title="Dislike this activity">&#128078;</button>
                        <button class="save-later-button ${activity.savedForLater ? "selected" : ""}" data-action="save-later" data-history-id="${activity.id}" aria-label="${activity.savedForLater ? "Remove from save for later" : "Save for later"}" title="${activity.savedForLater ? "Remove from save for later" : "Save for later"}">Save for Later</button>
                    </div>
                `;
                historyList.appendChild(item);
            });
        }

        historyList.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-history-id]");
            if (!button) return;

            const history = JSON.parse(localStorage.getItem("activityHistory") || "[]");
            const item = history.find((activity, index) => (activity.id || `${activity.pickedAt || ""}-${index}`) === button.dataset.historyId);
            if (!item) return;
            if (button.dataset.action === "favorite") {
                item.favorite = item.favorite !== true;
            } else if (button.dataset.action === "save-later") {
                item.savedForLater = item.savedForLater !== true;
            } else {
                item.rating = item.rating === button.dataset.rating ? null : button.dataset.rating;
            }
            localStorage.setItem("activityHistory", JSON.stringify(history));
            renderHistory();
        });

        filterButtons.forEach((button) => {
            button.addEventListener("click", () => {
                activeFilter = button.dataset.filter;
                filterButtons.forEach((item) => item.classList.toggle("active", item === button));
                renderHistory();
            });
        });

        clearHistoryBtn.addEventListener("click", () => {
            localStorage.removeItem("activityHistory");
            renderHistory();
        });

        window.addEventListener("storage", (event) => {
            if (event.key === "activityHistory") renderHistory();
        });

        window.addEventListener("pageshow", renderHistory);
        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) renderHistory();
        });

        renderHistory();
    </script>
</body>
</html>
